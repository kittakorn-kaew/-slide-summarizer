<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Summarizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #0f0f0f; color: #e8e8e8; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
  .subtitle { font-size: 0.875rem; color: #888; margin-bottom: 2rem; }
  .tabs { display: flex; gap: 8px; margin-bottom: 1rem; }
  .tab { padding: 8px 18px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid #333; background: transparent; color: #aaa; }
  .tab.active { background: #e8e8e8; color: #0f0f0f; border-color: #e8e8e8; }
  textarea { width: 100%; min-height: 200px; padding: 14px; font-size: 14px; line-height: 1.6; border: 1px solid #333; border-radius: 12px; resize: vertical; background: #1a1a1a; color: #e8e8e8; font-family: sans-serif; }
  textarea:focus { outline: none; border-color: #555; }
  .drop-zone { border: 1.5px dashed #444; border-radius: 12px; padding: 2.5rem; text-align: center; cursor: pointer; background: #1a1a1a; }
  .drop-zone:hover { border-color: #666; }
  .drop-zone p { font-size: 14px; color: #888; margin-bottom: 4px; }
  .drop-zone .filename { font-size: 13px; color: #aaa; margin-top: 8px; }
  .controls { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  select { padding: 8px 12px; font-size: 13px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #e8e8e8; cursor: pointer; }
  .btn { padding: 8px 24px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; background: #e8e8e8; color: #0f0f0f; border: none; }
  .btn:hover { background: #fff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .output-area { margin-top: 1.5rem; display: none; }
  .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .output-label { font-size: 13px; color: #888; font-weight: 500; }
  .copy-btn { font-size: 12px; padding: 5px 12px; border-radius: 8px; cursor: pointer; background: transparent; color: #aaa; border: 1px solid #333; }
  .copy-btn:hover { border-color: #555; color: #e8e8e8; }
  .output-content { background: #1a1a1a; border-radius: 12px; border: 1px solid #2a2a2a; padding: 1.25rem; font-size: 14px; line-height: 1.75; white-space: pre-wrap; min-height: 100px; }
  .loading { display: none; margin-top: 1.5rem; text-align: center; color: #888; font-size: 14px; padding: 2rem; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #333; border-top-color: #aaa; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>Slide Summarizer</h1>
  <p class="subtitle">สรุปเนื้อหาสไลด์เพื่อทบทวนได้จริง</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('text')">วางข้อความ</button>
    <button class="tab" onclick="switchTab('pdf')">อัพโหลด PDF</button>
  </div>

  <div id="panel-text">
    <textarea id="text-input" placeholder="วางเนื้อหาสไลด์ที่นี่..."></textarea>
  </div>

  <div id="panel-pdf" class="hidden">
    <div class="drop-zone" onclick="document.getElementById('pdf-input').click()">
      <p>คลิกหรือลากไฟล์ PDF มาวาง</p>
      <p class="filename" id="file-name">ยังไม่ได้เลือกไฟล์</p>
    </div>
    <input type="file" id="pdf-input" accept="application/pdf" style="display:none" onchange="handleFile(this.files[0])">
  </div>

  <div class="controls">
    <select id="style-select">
      <option value="study">สรุปเพื่อทบทวน (ครบถ้วน)</option>
      <option value="key">เฉพาะประเด็นหลัก</option>
      <option value="exam">เน้นสิ่งที่น่าออกสอบ</option>
      <option value="concept">แผนผังแนวคิด</option>
    </select>
    <button class="btn" onclick="summarize()" id="submit-btn">สรุปเลย ✦</button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>กำลังสรุปเนื้อหา...</div>
  </div>

  <div class="output-area" id="output-area">
    <div class="output-header">
      <span class="output-label">ผลสรุป</span>
      <button class="copy-btn" onclick="copyOutput()">คัดลอก</button>
    </div>
    <div class="output-content" id="output-content"></div>
  </div>
</div>

<script>
const API_KEY = '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';
let currentTab = 'text';
let pdfBase64 = null;

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('panel-text').classList.toggle('hidden', tab !== 'text');
  document.getElementById('panel-pdf').classList.toggle('hidden', tab !== 'pdf');
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'text') || (i === 1 && tab === 'pdf'));
  });
}

function handleFile(file) {
  if (!file) return;
  document.getElementById('file-name').textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => { pdfBase64 = e.target.result.split(',')[1]; };
  reader.readAsDataURL(file);
}

const stylePrompts = {
  study: 'สรุปเนื้อหาสำหรับการทบทวนอย่างจริงจัง ให้ครบถ้วนทุกประเด็นสำคัญ จัดโครงสร้างชัดเจนด้วยหัวข้อและหัวข้อย่อย อธิบายแนวคิดหลักให้เข้าใจได้จริง ใส่คำจำกัดความ ตัวอย่าง และการเชื่อมโยงระหว่างแนวคิดด้วย ตอบเป็นภาษาไทย',
  key: 'สรุปเฉพาะประเด็นหลักที่สำคัญที่สุด ไม่เกิน 7-10 ข้อ แต่ละข้อต้องอธิบายพอเข้าใจได้จริง ไม่ใช่แค่หัวข้อลอยๆ ตอบเป็นภาษาไทย',
  exam: 'วิเคราะห์เนื้อหาและสรุปสิ่งที่มีโอกาสออกสอบสูง จัดกลุ่มเป็นหมวด เช่น คำจำกัดความที่ต้องจำ หลักการสำคัญ ความสัมพันธ์ระหว่างแนวคิด ตอบเป็นภาษาไทย',
  concept: 'สรุปเป็นแผนผังแนวคิด (concept map) ในรูปแบบข้อความ แสดงความสัมพันธ์ระหว่างแนวคิดหลักและแนวคิดรอง ใช้การเยื้องและลูกศร (→) เพื่อแสดงความเชื่อมโยง ตอบเป็นภาษาไทย'
};

async function summarize() {
  const style = document.getElementById('style-select').value;
  let messages;

  if (currentTab === 'text') {
    const text = document.getElementById('text-input').value.trim();
    if (!text) { alert('กรุณาวางเนื้อหาก่อนครับ'); return; }
    messages = [{ role: 'user', content: 'นี่คือเนื้อหาจากสไลด์การเรียน:\n\n' + text }];
  } else {
    if (!pdfBase64) { alert('กรุณาอัพโหลด PDF ก่อนครับ'); return; }
    messages = [{ role: 'user', content: [
      { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: pdfBase64 } },
      { type: 'text', text: 'นี่คือสไลด์การเรียนที่ต้องการสรุป' }
    ]}];
  }

  document.getElementById('loading').style.display = 'block';
  document.getElementById('output-area').style.display = 'none';
  document.getElementById('submit-btn').disabled = true;

  try {
    const res = await fetch('/api/summarize', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1500, system: stylePrompts[style], messages })
    });
    const data = await res.json();
    const text = data.content?.find(b => b.type === 'text')?.text || 'ไม่สามารถสรุปได้ครับ';
    document.getElementById('output-content').textContent = text;
    document.getElementById('output-area').style.display = 'block';
  } catch (e) {
    document.getElementById('output-content').textContent = 'เกิดข้อผิดพลาด: ' + e.message;
    document.getElementById('output-area').style.display = 'block';
  } finally {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('submit-btn').disabled = false;
  }
}

function copyOutput() {
  const text = document.getElementById('output-content').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    btn.textContent = 'คัดลอกแล้ว ✓';
    setTimeout(() => { btn.textContent = 'คัดลอก'; }, 2000);
  });
}
</script>
</body>
</html>
